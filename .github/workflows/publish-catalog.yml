name: Publish Journey Catalog

on:
  push:
    branches:
      - main
    paths:
      - "source/packages/**"
      - "scripts/validate_packages.py"
      - "scripts/build_catalog.py"
      - "index.html"
      - ".github/workflows/publish-catalog.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: journey-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Journey catalog
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate packages
        run: python scripts/validate_packages.py

      - name: Assign catalog version
        shell: bash
        run: |
          echo "JOURNEY_CATALOG_VERSION=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build production catalog
        run: python scripts/build_catalog.py

      - name: Verify generated files
        shell: bash
        run: |
          test -f catalog.json
          test -d packages
          test "$(find packages -maxdepth 1 -name '*.json' | wc -l)" -gt 0
          git diff --check

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp catalog.json _site/catalog.json
          cp -R packages _site/packages
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    name: Deploy Journey catalog
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4